# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
  # Allows to reuse this workflow in other workflows
  workflow_call:
    secrets: 
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: Builds project and uploads artifact
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Cleanup space before checkout
      - name: Check disk space
        run: df . -h
      - name: Free disk space
        run: |
          sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm || true
          echo "some directories deleted"
          sudo apt-get purge -y \
            aria2 ansible shellcheck rpm zsync firefox google-chrome-stable \
            kubectl mercurial libssl-dev pollinate powershell sphinxsearch \
            yarn microsoft-edge-stable google-cloud-cli ant ant-optional \
            azure-cli \
            >/dev/null 2>&1 || true
          sudo apt-get purge -y 'php8.3-*' >/dev/null 2>&1 || true
          sudo apt-get purge -y '~n ^mysql' >/dev/null 2>&1 || true
          sudo apt-get purge -y '~n ^dotnet' >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1
          sudo apt-get autoclean -y >/dev/null 2>&1
          echo "some packages purged"
      - name: Delete huge unnecessary tools folder
        run: sudo rm -rf /opt/hostedtoolcache
      - name: Check disk space
        run: |
          sudo dpkg-query -Wf '${Installed-Size}\t${Package}\n' | sort -nr | head
          df . -h
          sudo du /usr/ -hx -d 4 --threshold=1G | sort -hr | head
          
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      # Cache
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # Build
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
    
      # Upload build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: html${{ github.head_ref }}.${{ github.sha }}
          path: build/WebGL
          retention-days: 1
          overwrite: true

